<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo: Serpiente</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b2412; color: #e9f5c9; font: 16px system-ui, sans-serif; overflow: hidden; touch-action: none; }
  canvas { display: block; margin: 0 auto; width: 100vmin; height: 100vmin; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c" width="480" height="480" aria-label="Serpiente: dirige con las flechas, WASD o deslizando el dedo"></canvas>
<script>
(() => {
  const cv = document.getElementById('c');
  const g = cv.getContext('2d');
  const N = 20, C = 24;
  let snake, dir, nextDir, food, score, best = 0, state = 'ready', tick = 0, speed = 9;

  function reset() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = { x: 1, y: 0 }; nextDir = dir; score = 0; speed = 9; placeFood();
  }
  function placeFood() {
    do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
    while (snake.some((s) => s.x === food.x && s.y === food.y));
  }
  function turn(x, y) {
    if (state !== 'play') { reset(); state = 'play'; }
    if (x === -dir.x && y === -dir.y) return;
    nextDir = { x, y };
  }
  const KEYS = { ArrowUp: [0, -1], w: [0, -1], W: [0, -1], ArrowDown: [0, 1], s: [0, 1], S: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0], ArrowRight: [1, 0], d: [1, 0], D: [1, 0] };
  addEventListener('keydown', (e) => {
    const k = KEYS[e.key];
    if (k) { e.preventDefault(); turn(k[0], k[1]); }
    else if ((e.key === ' ' || e.key === 'Enter') && state !== 'play') { reset(); state = 'play'; }
  });
  let t0 = null;
  cv.addEventListener('pointerdown', (e) => { t0 = { x: e.clientX, y: e.clientY }; if (state !== 'play') { reset(); state = 'play'; } });
  cv.addEventListener('pointerup', (e) => {
    if (!t0) return;
    const dx = e.clientX - t0.x, dy = e.clientY - t0.y; t0 = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy));
  });

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || snake.some((s) => s.x === head.x && s.y === head.y)) {
      state = 'over'; best = Math.max(best, score); return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) { score++; speed = Math.min(20, 9 + score / 3); placeFood(); }
    else snake.pop();
  }

  function draw() {
    g.fillStyle = '#1b2412'; g.fillRect(0, 0, 480, 480);
    g.fillStyle = '#243118';
    for (let y = 0; y < N; y++) for (let x = (y % 2); x < N; x += 2) g.fillRect(x * C, y * C, C, C);
    g.fillStyle = '#ff6b4a';
    g.fillRect(food.x * C + 4, food.y * C + 4, C - 8, C - 8);
    snake.forEach((s, i) => { g.fillStyle = i === 0 ? '#e9f5c9' : '#9cc95a'; g.fillRect(s.x * C + 1, s.y * C + 1, C - 2, C - 2); });
    g.fillStyle = '#e9f5c9'; g.font = 'bold 18px system-ui, sans-serif'; g.textAlign = 'left';
    g.fillText(`Puntos ${score}   Récord ${best}`, 10, 24);
    if (state !== 'play') {
      g.fillStyle = 'rgba(27,36,18,.8)'; g.fillRect(40, 170, 400, 140);
      g.fillStyle = '#e9f5c9'; g.textAlign = 'center';
      g.font = 'bold 30px system-ui, sans-serif';
      g.fillText(state === 'over' ? 'Fin de la partida' : 'Serpiente', 240, 220);
      g.font = '17px system-ui, sans-serif';
      g.fillText('Flechas / WASD o desliza el dedo', 240, 255);
      g.fillText('Espacio o toca para empezar', 240, 282);
    }
  }

  reset();
  let last = performance.now(), acc = 0;
  function loop(t) {
    acc += Math.min(250, t - last); last = t;
    const dt = 1000 / speed;
    while (acc >= dt) { if (state === 'play') step(); acc -= dt; tick++; }
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
