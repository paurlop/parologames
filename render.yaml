# Render Blueprint: parologames gratis en Render (plan free).
# Dos servicios del mismo código: la web y el origen aislado de los juegos.
# En el plan gratuito el disco se borra en cada reinicio, así que los juegos se construyen en cada despliegue desde
# games-dist/catalog.json y el panel de subida está desactivado. Para publicar un juego: añade su ZIP y su portada a
# games-dist/, apúntalo en catalog.json, haz commit y push; Render vuelve a desplegar solo.
# SITE_ORIGIN y GAMES_ORIGIN son las direcciones públicas (la propiedad "host" de Render es la interna).
services:
  - type: web
    name: parologames
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev && node scripts/build-catalog.js
    startCommand: node src/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: ROLE
        value: site
      - key: ADMIN_ENABLED
        value: "false"
      - key: DATA_DIR
        value: ./data
      - key: TRUST_PROXY
        value: "1"
      - key: IP_HASH_SALT
        generateValue: true
      - key: SITE_ORIGIN
        value: https://parologames.onrender.com
      - key: GAMES_ORIGIN
        value: https://parologames-juegos.onrender.com

  - type: web
    name: parologames-juegos
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev && node scripts/build-catalog.js
    startCommand: node src/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: ROLE
        value: games
      - key: ADMIN_ENABLED
        value: "false"
      - key: DATA_DIR
        value: ./data
      - key: TRUST_PROXY
        value: "1"
      - key: IP_HASH_SALT
        generateValue: true
      - key: SITE_ORIGIN
        value: https://parologames.onrender.com
      - key: GAMES_ORIGIN
        value: https://parologames-juegos.onrender.com
      - key: GAMES_CONNECT_SRC
        value: https://www.wikidata.org
      - key: GAMES_IMG_SRC
        value: https://commons.wikimedia.org https://upload.wikimedia.org
